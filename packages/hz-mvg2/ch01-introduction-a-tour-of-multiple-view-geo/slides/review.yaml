- layout: equation
  title: 1.1 Homogeneous coordinates, X′ = HX
  equations:
  - tex: (kx,\ ky,\ k)^\top \sim (x,\ y,\ 1)^\top
    label: p. 2
  - tex: \mathbf{X}^\prime = \mathrm{H}_{(n+1)\times(n+1)}\, \mathbf{X}
    label: p. 3
  bullets:
  - Points at infinity have last coordinate 0; H is 8 DoF (3×3), 15 DoF (4×4)
  - 'Trap: dehomogenizing a point at infinity; test |w| against ‖x‖, raise'
  - 'Print slip p. 3: line and plane at infinity swapped with space and image'
  source: lecture.md §L1
