- layout: equation
  title: '1.1.1 Ladder: Ω∞ and perpendicularity'
  equations:
  - tex: \mathbf{d}_1^\top\, \Omega_\infty\, \mathbf{d}_2 = 0
    label: p. 6
  bullets:
  - Circular points (1, ±i, 0)ᵀ lie on every circle (p. 5); Ω∞ = I in a Euclidean frame
  - 'Affine: line at infinity fixed; similarity: circular points fixed too'
  - 'Trap: affine corner 49.0° and opposite sides 0.0° apart; right angles lost'
  source: lecture.md §L2
  takeaway: Affine maps lose right angles even though parallels survive
  where:
  - - Ω∞
    - absolute conic, T = 0
  - - d₁, d₂
    - direction vectors
- layout: equation
  title: 1.2 Camera and plane homography
  equations:
  - tex: (x,\ y,\ w)^\top = \mathrm{P}_{3\times4}\,(X,\ Y,\ Z,\ T)^\top
    label: p. 7
  - tex: H = [\,\mathbf{p}_1\ \mathbf{p}_2\ \mathbf{p}_4\,]\ \ (Z = 0)
    label: p. 7
  bullets:
  - Rank 3, centre PC = 0 (§6.2.1, p. 158); same centre means H, any scene
  - 'Trap: centre on the plane makes H rank 2; depth 4–12 m breaks H at 0.048 m'
  source: lecture.md §L3
  takeaway: Centre on the plane makes H rank 2; depth breaks H at 0.048 m
  where:
  - - P
    - camera, 3×4, rank 3
  - - H
    - plane homography, 3×3
  - - (X, Y, Z, T)
    - world point
