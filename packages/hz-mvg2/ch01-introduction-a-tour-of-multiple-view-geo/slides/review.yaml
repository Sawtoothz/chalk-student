- layout: code
  title: 'C1 Homogeneous points: scale-free infinity test'
  code: "def normalize_h(Xh):\n    Xh = np.atleast_2d(np.asarray(Xh, float))\n    return Xh / np.linalg.norm(Xh, axis=1, keepdims=True)\n\ndef at_infinity(Xh, tol=1e-12):\n    return np.abs(normalize_h(Xh)[:, -1]) < tol\n\ndef dehom(Xh, tol=1e-12):\n    Xh = np.atleast_2d(np.asarray(Xh, float))\n    if np.any(at_infinity(Xh, tol)):\n        raise ValueError(\"point at infinity\")\n    return Xh[:, :-1] / Xh[:, -1:]\n"
  bullets:
  - Rows are points; dehomogenize last and raise at infinity
  source: translate.md C1
- layout: code
  title: C3 Camera centre by SVD, depth by eq. 6.15
  code: "def camera_centre(P, rank_tol=1e-12):\n    _, s, Vt = np.linalg.svd(P)\n    if s[2] < rank_tol * s[0]:\n        raise ValueError(\"rank P < 3: not a camera (p. 7)\")\n    return Vt[-1]\n\ndef depth(P, Xh):\n    Xh = np.atleast_2d(Xh)\n    M = P[:, :3]\n    w = Xh @ P[2]\n    return (np.sign(np.linalg.det(M)) * w\n            / (Xh[:, 3] * np.linalg.norm(M[2])))\n"
  bullets:
  - 'Negative depth: behind the camera, same pixel as a point in front'
  source: translate.md C3
- layout: code
  title: C4 Plane homography and the pixel fit test
  code: "def plane_homography(P, cond_max=1e12):\n    H = P[:, [0, 1, 3]]\n    if np.linalg.cond(H) > cond_max:\n        raise ValueError(\"plane Z = 0 through the centre\")\n    return H / np.linalg.norm(H)\n\ndef transfer_rms_px(H, x1, x2):\n    y = np.atleast_2d(x1) @ H.T\n    d = y[:, :2] / y[:, 2:] - x2[:, :2] / x2[:, 2:]\n    return np.sqrt(np.mean(np.sum(d ** 2, axis=1)))\n"
  bullets:
  - Pick columns, do not fit; normalize by Frobenius norm, not H₃₃
  source: translate.md C4
- layout: code
  title: 'C5 Projective ambiguity: solve, do not invert'
  code: "def apply_ambiguity(Ps, Xh, H, cond_max=1e10):\n    if np.linalg.cond(H) > cond_max:\n        raise ValueError(\"H is numerically singular\")\n    Ps_new = [np.linalg.solve(H.T, P.T).T for P in Ps]\n    Ps_new = [P / np.linalg.norm(P) for P in Ps_new]\n    Xh_new = np.atleast_2d(Xh) @ H.T\n    Xh_new /= np.linalg.norm(Xh_new, axis=1, keepdims=True)\n    return Ps_new, Xh_new\n"
  bullets:
  - 'P H⁻¹ = (H⁻ᵀPᵀ)ᵀ: one LU of Hᵀ; the oracle is the pixel change'
  source: translate.md C5
- layout: code
  title: C6 Epipolar distance in pixels, scale-free rank
  code: "def epipolar_distance_px(F, x, xp):\n    x, xp = np.atleast_2d(x), np.atleast_2d(xp)\n    l = x @ F.T\n    return (np.abs(np.sum(xp * l, axis=1))\n            / np.hypot(l[:, 0], l[:, 1]))\n\ndef rank2_gap(F):\n    s = np.linalg.svd(F, compute_uv=False)\n    return s[2] / s[0]\n"
  bullets:
  - Normalize points before step (i); same centre gives F = 0
  source: translate.md C6
- layout: code
  title: C7 Linear triangulation, any number of views
  code: "def triangulate(Ps, xs):\n    rows = []\n    for P, x in zip(Ps, xs):\n        x = x / x[2]\n        rows += [x[0] * P[2] - P[0], x[1] * P[2] - P[1]]\n    A = np.array(rows)\n    A /= np.linalg.norm(A, axis=1, keepdims=True)\n    X = np.linalg.svd(A)[2][-1]\n    ...  # unit-norm X: see translate.md C7\n"
  bullets:
  - Homogeneous DLT, row scaling; check cheirality and reprojection
  source: translate.md C7
- layout: code
  title: 'C8 Ray angle: back-project, then atan2'
  code: "def back_project(K, x):\n    return solve_triangular(K, np.atleast_2d(x).T,\n                            lower=False).T\n\ndef ray_angle(K, x1, x2):\n    d1, d2 = back_project(K, x1), back_project(K, x2)\n    cross = np.linalg.norm(np.cross(d1, d2), axis=1)\n    dot = np.sum(d1 * d2, axis=1)\n    ...  # atan2 of cross and dot: see translate.md C8\n"
  bullets:
  - No inverse of KKᵀ; arccos loses about half the digits near zero
  source: translate.md C8
- layout: code
  title: C9 Metric upgrade by one Cholesky
  code: "def metric_upgrade(M, omega):\n    Omega = M.T @ omega @ M\n    Omega = 0.5 * (Omega + Omega.T)\n    if np.trace(Omega) < 0:\n        Omega = -Omega\n    ...  # Cholesky of Omega: see translate.md C9\n    H = np.eye(4)\n    H[:3, :3] = L.T\n    return H\n"
  bullets:
  - 'Equals Result 10.5''s H up to a rotation: A = L⁻ᵀQ'
  - Upgrade cameras and points together with C5
  source: translate.md C9
