- layout: table
  title: Symptom to fix
  table:
    header:
    - Symptom
    - Cause
    - Try
    rows:
    - - F flips between frames
      - Rotation or planar scene
      - Fit H and F, pick by score
    - - Parallels converge
      - π∞ unknown
      - Calibrate K; impose parallels
    - - Right angles wrong
      - Ω∞ (ω, K) wrong
      - Recalibrate f, aspect, skew
    - - Bearings off at the edge
      - Wrong f in ω
      - Recalibrate
    - - Map size drifts
      - Scale unobservable
      - IMU, stereo, scale prior
    - - BA diverges
      - Bad start or free gauge
      - Initialize; anchor pose and scale
    - - Panorama ghosting
      - Centre moved
      - Rotate about the centre
    - - Bird's-eye warps
      - Stale horizon
      - Update H from attitude
    widths:
    - 3
    - 3
    - 4
  source: lecture.md symptom table
- layout: bullets
  title: Mistakes already made (REVIEW.md)
  bullets:
  - PC = 0 is §6.2.1, p. 158; p. 7 gives only rank 3 and the [I | 0] centre
  - Cheirality (which side is in front) is ch. 21, p. 515, not p. 11
  - Seven matches fix F is a dof count; the book gives no reason (p. 281)
  - The vanishing point is finite; the ideal point is the wall direction
  - 'H_M differs from Result 10.5''s H by a rotation: A = L⁻ᵀQ'
  - Example 1.1 is pp. 9–10, not p. 10
  source: REVIEW.md
- layout: key
  title: The one sentence
  statement: Images fix a scene only up to a group; each extra piece of knowledge removes part of it
  detail: Projective, then affine with π∞, then metric with Ω∞; scale stays free
  source: map.md
- layout: bullets
  title: Conventions that bite
  bullets:
  - P is a 3×4 camera, not a covariance; H is a homography, not a Jacobian
  - H&Z P = K[R | t] maps world to camera; GTSAM Pose3 is the inverse
  - ω is the image of the absolute conic, not an angular rate
  - T is the fourth homogeneous coordinate
  - Noise, outliers and RANSAC are not in this chapter (§4.7)
  source: lecture.md notation
- layout: bullets
  title: Where each claim is proved
  bullets:
  - 'Ch. 2–3: lines, conics, Ω∞, angle formula (3.23)'
  - 'Ch. 6–8: K[R | t], IAC; ch. 9 and 11: F; ch. 12: triangulation'
  - 'Ch. 18–19: factorization, bundle adjustment, auto-calibration'
  - 'Robot side: lesson t2.8 graph SLAM; scale from the IMU'
  source: map.md feeds
