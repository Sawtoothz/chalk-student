  - layout: code
    title: "C5 Map-based sampler with a retry cap"
    code: |
      def sample_motion_model_with_map(u, X, sampler, in_free, rng,
                                       max_tries=10):
          Xn = sampler(u, X, rng)
          ok = np.asarray(in_free(Xn), dtype=bool)
          for _ in range(max_tries - 1):
              if ok.all():
                  break
              bad = ~ok
              Xn[bad] = sampler(u, X[bad], rng)
              ok[bad] = in_free(Xn[bad])
          return Xn, ok.astype(float)
    bullets:
      - "Redraw only the failures; π = 0 where every draw failed"
      - "Configuration space grown once, at map load"
    source: translate.md C5
