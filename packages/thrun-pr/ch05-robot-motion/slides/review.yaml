      - "**Floor on b²** in each term's units: at rest the naive density is 0/0"
      - "**Unit normals times √b²**, not normal(0, b): works for b² = 0 or an array"
      - "Triangular density is zero beyond ±√6 b: mix in a small uniform term"
    notes: "Code is in translate.md C1; it matches the reference solution, so it is not shown here."
