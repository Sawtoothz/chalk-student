  - layout: code
    title: "C2 Velocity forward, chord form"
    code: |
      def velocity_forward(X, v_h, w_h, g_h, dt):
          X = np.asarray(X, dtype=float)
          half = 0.5 * w_h * dt
          s = v_h * dt * np.sinc(half / np.pi)
          th = X[..., 2]
          return np.stack([
              X[..., 0] + s * np.cos(th + half),
              X[..., 1] + s * np.sin(th + half),
              wrap(th + (w_h + g_h) * dt)], axis=-1)
    bullets:
      - "Nothing divides by ω̂, so no straight-line branch"
      - "Wrap θ′; one call for all M particles"
    source: translate.md C2
  - layout: compare
    title: "C3 Velocity inverse: book vs chord form"
    columns:
      - heading: "Table 5.1 as printed"
        bullets:
          - "Line 7: v̂ = (Δθ/Δt) r∗ loses the sign"
          - "Line 2 is 0/0 for a straight move"
          - "Lines 6 and 9 need wrapping"
      - heading: "Chord form (C3)"
        bullets:
          - "Displacement along and left of heading, then atan2"
          - "Sign of v̂ from displacement along heading"
          - "One angle difference left, wrapped"
          - "Valid for less than a half turn per step"
    takeaway: "Pose density: divide by the Jacobian determinant, floor |v̂|Δt at 1 cm"
    notes: "Code is in translate.md C3; it matches the reference solution, so it is not shown here."
    source: translate.md C3
  - layout: code
    title: "C4 Odometry parameters and variances"
    code: |
      def odometry_params(P0, P1):
          dx, dy = P1[..., 0] - P0[..., 0], P1[..., 1] - P0[..., 1]
          trans = np.hypot(dx, dy)
          rot1 = np.where(trans < TRANS_EPS, 0.0,
                          wrap(np.arctan2(dy, dx) - P0[..., 2]))
          rot2 = wrap(P1[..., 2] - P0[..., 2] - rot1)
          return rot1, trans, rot2

      def rot_for_noise(rot):
          return np.minimum(np.abs(rot), np.abs(wrap(rot - np.pi)))
    bullets:
      - "Rotation in place: δrot1 = 0 below 1 cm"
      - "Reversing is not a half turn: measure from the nearer of ahead and back"
    source: translate.md C4
  - layout: steps
    title: "C4 Odometry sampler per step"
    steps:
      - {title: "Once per step", text: "Lines 2–4 depend only on u: compute δ once, not per particle"}
      - {title: "Perturb", text: "Measured δ in the variances, as (5.44)–(5.46) do"}
      - {title: "Move", text: "Read θ before overwriting it; each particle uses its own heading"}
