  - layout: code
    title: "C6 Weighted mean and covariance"
    code: |
      def weighted_mean_cov(X, w, angle_idx=()):
          w = w / w.sum()
          mu = w @ X
          for j in angle_idx:                       # circular mean
              mu[j] = np.arctan2(w @ np.sin(X[:, j]), w @ np.cos(X[:, j]))
          D = X - mu
          for j in angle_idx:
              D[:, j] = wrap(D[:, j])               # wrap before squaring
          cov = (D * w[:, None]).T @ D / (1.0 - np.sum(w ** 2))
          return mu, cov
    bullets:
      - "Circular mean for θ; divide by 1 − Σw̃² for unbiased covariance"
      - "One Gaussian only for one mode: cluster first"
    source: translate.md C6
    notes: "Always pass the weights, whether or not the step resampled."
