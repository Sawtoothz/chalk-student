  - layout: equation
    title: "SO(3) Exp and Log (App. B, pp. 14–15)"
    equations:
      - {tex: '\mathbf{R} = \mathbf{I} + \sin\theta\,[\mathbf{u}]_\times + (1-\cos\theta)[\mathbf{u}]_\times^2', label: "(134)"}
      - {tex: '\theta\mathbf{u} = \frac{\theta(\mathbf{R}-\mathbf{R}^\top)^\vee}{2\sin\theta}', label: "(135)"}
    takeaway: "Trap: (135) is 0/0 at θ → 0 and at θ → π"
    notes: "Rodrigues comes from the power series because the powers of the skew matrix cycle with period two. Log needs a different route near π, where R minus R transpose vanishes with sin θ. Go through the quaternion."
    source: lecture.md §L17

  - layout: code
    title: "Robust coefficients and quaternion Log (C1)"
    code: |
      def coef_a(th):   # (1 - cos th)/th^2, half-angle form
          s = np.sinc(th / (2 * np.pi))     # sin(th/2)/(th/2)
          return 0.5 * s * s

      def coef_b(th):   # (th - sin th)/th^3, series below 0.3
          th = abs(th)
          if th < 0.3:
              return sum((-1) ** k * th ** (2 * k) / math.factorial(2 * k + 3)
                         for k in range(5))
          return (th - np.sin(th)) / th ** 3

      def quat_log(q):  # (133), w > 0 rule
          w, v = (q[0], q[1:]) if q[0] >= 0 else (-q[0], -q[1:])
          n = np.linalg.norm(v)
          return np.zeros(3) if n == 0.0 else 2 * np.arctan2(n, w) / n * v
    bullets: ["Half-angle form: no subtraction, no branch at θ = 0", "Flip q to w ≥ 0 before Log: the short rotation"]
    source: translate.md C1

  - layout: stats
    title: "Why the robust Log: Log(Exp(θ)) error"
    stats: [{value: "NaN", label: "naive Log at θ = 10⁻⁹"}, {value: "0.16 rad", label: "naive Log at θ = π − 10⁻⁷"}, {value: "6.4 × 10⁻¹⁶", label: "robust Log at both ends, rad"}]
    bullets: ["Coefficient errors for θ from 10⁻¹² to π: 3.3 × 10⁻¹⁶ for a and 4.0 × 10⁻¹⁵ for b"]
