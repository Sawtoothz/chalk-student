  - layout: code
    title: "SE(2) Exp and Log with V(θ) (C4)"
    code: |
      def se2_V(th):                      # (158)
          return np.sinc(th/np.pi)*np.eye(2) + th*coef_a(th)*J1

      def se2_exp(tau):                   # (156)
          M = np.eye(3); M[:2, :2] = so2(tau[2])
          M[:2, 2] = se2_V(tau[2]) @ tau[:2]
          return M

      def se2_log(M):                     # (157)
          th = np.arctan2(M[1, 0], M[0, 0])
          A, B = np.sinc(th/np.pi), th*coef_a(th)
          rho = (A*np.eye(2) - B*J1) @ M[:2, 2] / (A*A + B*B)
          return np.r_[rho, th]
    bullets: ["V⁻¹ = (A·I − B·[1]ₓ)/(A² + B²): no 2×2 inverse call", "τ = (ρ, θ), translation first"]
    source: translate.md C4

  - layout: compare
    title: "SE(2) J_r third column: printed vs rewritten"
    columns:
      - heading: "Printed (163)"
        bullets: ["Terms with θ² in the denominator", "Off by 2.7 × 10⁻³ at θ = 2 × 10⁻⁷", "Off by 1.4 × 10⁻⁴ at θ = 10⁻⁶", "Lands in range when driving straight"]
      - heading: "Rewritten with a(θ), b(θ)"
        bullets: ["Same coefficients as SO(3): a, b", "Series below the switch", "Full precision at every θ", "manif's switch: θ = 1.5 × 10⁻⁷"]
    takeaway: "On a robot, either live with manif's error or patch those two lines"
    source: translate.md C4

  - layout: code
    title: "ESKF correction, robust form (C8)"
    code: |
      def eskf_update(X, P, y, b, Q_meas):          # (101)-(102)
          R, t = X[:2, :2], X[:2, 2]
          z = y - R.T @ (b - t)
          H = -np.hstack([np.eye(2), (R.T @ J1 @ (b - t))[:, None]])
          Z = H @ P @ H.T + Q_meas
          K = cho_solve(cho_factor(Z), H @ P).T     # no Z^-1
          dx = K @ z
          IKH = np.eye(3) - K @ H
          P = IKH @ P @ IKH.T + K @ Q_meas @ K.T    # Joseph form
          Jr = se2_Jr(dx)                           # reset, not in (102)
          P = Jr @ P @ Jr.T
          return X @ se2_exp(dx), 0.5 * (P + P.T)
    bullets: ["Gate on zᵀZ⁻¹z above 9.21 (χ², 2 dof, 99 %)"]
    source: translate.md C8

