  - layout: agenda
    title: "What the deck covers"
    items: ["Exp and Log on SO(3), S³, SE(2)", "Jacobian blocks and the chain rule", "ESKF and Gauss-Newton SAM", "Measured numbers", "Mistakes already made", "Implementation plan"]
