  - layout: equation
    title: "Elementary blocks (III-B, p. 10)"
    equations:
      - {tex: '\mathbf{J}^{\mathcal{X}^{-1}}_{\mathcal{X}} = -\mathbf{Ad}_{\mathcal{X}}\ (62)\qquad \mathbf{J}^{\mathcal{X}\circ\mathcal{Y}}_{\mathcal{X}} = \mathbf{Ad}_{\mathcal{Y}}^{-1}\ (65)\qquad \mathbf{J}^{\mathcal{X}\circ\mathcal{Y}}_{\mathcal{Y}} = \mathbf{I}\ (66)', label: ""}
      - {tex: '\mathbf{Ad}_{\mathrm{Exp}(\boldsymbol{\tau})} = \mathbf{J}_l(\boldsymbol{\tau})\,\mathbf{J}_r^{-1}(\boldsymbol{\tau})\ (75)\qquad \mathbf{J}_r(-\boldsymbol{\tau}) = \mathbf{J}_l(\boldsymbol{\tau})\ (76)', label: ""}
    takeaway: "Trap: mixing right and left ⊖ leaves the Jacobian off by an Ad"
    notes: "Derive (62) and (65) from (41b), then move the inner Exp past X with (20). A finite-difference check catches the wrong side at once."
    source: lecture.md §L11

