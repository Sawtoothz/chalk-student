[project]
name = "chalk"
version = "0.1.0"
description = "Chalk: teaching packages built by Claude from textbook chapters and papers; CLI and GUI"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "matplotlib>=3.9",
  "plotly>=5.24",
  "marimo>=0.10",
  "pymupdf>=1.24",
  "markdown>=3.6",
  "pyyaml>=6.0",
  "pytest>=8.0",
  "cvxpy>=1.5",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "python-pptx>=1.0",
]

[project.optional-dependencies]
viz3d = ["viser>=1.0", "rerun-sdk>=0.20"]
gpu = ["torch>=2.4"]

[tool.pytest.ini_options]
testpaths = ["packages", "examples"]
python_files = ["test_*.py"]
