<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Chalk{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400&display=swap">
<link rel="stylesheet" href="/static/chalk.css">
</head>
<body class="{% block bodyclass %}{% endblock %}">
<div class="bar"><div class="in">
  <a class="word" href="/">Chalk<i></i></a>
  <nav class="nav">
    <a href="/" {% if page == 'library' %}aria-current="page"{% endif %}>Library</a>
    {% if page == 'run' %}<a href="" aria-current="page">Run</a>{% endif %}
    <a href="/ai" id="aichip" title="Which AI agent runs the stages" {% if page == 'ai' %}aria-current="page"{% endif %}>AI: {{ engine_label() }}</a>
  </nav>
  <span class="who">{% block who %}{% endblock %}</span>
  <button type="button" class="autosw" id="autosw" role="switch" aria-checked="{{ 'true' if settings.auto else 'false' }}"
    title="When on, every stage that finishes starts the next one (map → highlight → … → review → slides) until the package is done. It stops on a failure, on Stop, or when you switch it off. A whole chapter costs about $20–30.">
    <span class="lbl">Auto-run</span><span class="knob"><i></i></span><span class="val">{{ 'On' if settings.auto else 'Off' }}</span></button>
</div></div>
<main>{% block body %}{% endblock %}</main>
<script>
window.CHALK = {auto: {{ 'true' if settings.auto else 'false' }}};
document.getElementById('autosw').addEventListener('click', async e => {
  const b = e.currentTarget, on = b.getAttribute('aria-checked') !== 'true';
  b.disabled = true;
  try {
    const r = await fetch('/settings', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({auto: on})});
    const s = await r.json(); window.CHALK.auto = !!s.auto;
    b.setAttribute('aria-checked', s.auto ? 'true' : 'false'); b.querySelector('.val').textContent = s.auto ? 'On' : 'Off';
    document.dispatchEvent(new CustomEvent('chalk-auto'));
  } finally { b.disabled = false; }
});
</script>
{% block scripts %}{% endblock %}
</body>
</html>
